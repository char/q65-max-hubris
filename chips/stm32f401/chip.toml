[usb]
address = 0x50000000
size = 0x40000
interrupts = { irq = 67 }

[gpio]
address = 0x40020000
size = 4096

[gpioa]
address = 0x40020000
size = 1024

[gpiob]
address = 0x40020400
size = 1024

[spi1]
address = 0x40013000
size = 1024

# SRAM kept out of the memory map so that a word written there survives a reset (see `board`).
[reboot-flag]
address = 0x2000ff00
size = 256
